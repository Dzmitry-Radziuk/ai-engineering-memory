name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run Ruff
        run: python -m ruff check .
      - name: Check Ruff formatting
        run: python -m ruff format --check .
      - name: Run Mypy
        run: python -m mypy
      - name: Run tests
        env:
          AI_MEMORY_DB: ${{ runner.temp }}/ai-engineering-memory-ci.sqlite
          AI_MEMORY_HOOK_LOG: ${{ runner.temp }}/hooks.jsonl
          CODEX_HOME: ${{ runner.temp }}/codex-home
          COVERAGE_FILE: ${{ runner.temp }}/coverage
        run: |
          python -m coverage run --source=ai_engineering_memory -m pytest -v --basetemp="${{ runner.temp }}/pytest"
          python -m coverage report --fail-under=85

  package:
    name: Build Python distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip>=26.2.2"
          python -m pip install --disable-pip-version-check build
      - name: Build wheel and source archive
        run: python -m build --outdir "${{ runner.temp }}/dist"
      - name: Install wheel into isolated virtual environment
        run: |
          python -m venv "${{ runner.temp }}/wheel-smoke"
          "${{ runner.temp }}/wheel-smoke/bin/python" -m pip install --disable-pip-version-check --upgrade "pip>=26.2.2"
          "${{ runner.temp }}/wheel-smoke/bin/python" -m pip install "${{ runner.temp }}/dist/"*.whl
          "${{ runner.temp }}/wheel-smoke/bin/python" -m pip check
      - name: Smoke test installed CLI without creating a database
        env:
          AI_MEMORY_DB: ${{ runner.temp }}/wheel-smoke.sqlite
        run: |
          "${{ runner.temp }}/wheel-smoke/bin/ai-memory" --help
          test ! -e "$AI_MEMORY_DB"
      - name: Install pipx test frontend
        run: python -m pip install --disable-pip-version-check "pipx==1.13.0"
      - name: Install wheel through pipx and smoke test CLI
        env:
          PIPX_HOME: ${{ runner.temp }}/pipx/home
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx/bin
        run: |
          python -m pipx install --python "$(python -c 'import sys; print(sys.executable)')" "${{ runner.temp }}/dist/"*.whl
          "${{ runner.temp }}/pipx/bin/ai-memory" --help

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install project and pinned audit tool
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip>=26.2.2"
          python -m pip install --disable-pip-version-check -e ".[dev]" "pip-audit==2.10.1"
      - name: Audit installed dependencies
        run: python -m pip_audit --local --disable-pip --cache-dir "${{ runner.temp }}/pip-audit-cache"
