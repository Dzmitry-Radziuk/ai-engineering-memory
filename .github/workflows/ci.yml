name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      AI_MEMORY_DB: ${{ runner.temp }}/ai-engineering-memory-ci.sqlite
      AI_MEMORY_HOOK_LOG: ${{ runner.temp }}/hooks.jsonl
      CODEX_HOME: ${{ runner.temp }}/codex-home
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -v --basetemp="${{ runner.temp }}/pytest"

  package:
    name: Build Python distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check build
      - name: Build wheel and source archive
        run: python -m build --outdir "${{ runner.temp }}/dist"
      - name: Install wheel into isolated virtual environment
        run: |
          python -m venv "${{ runner.temp }}/wheel-smoke"
          "${{ runner.temp }}/wheel-smoke/bin/python" -m pip install --no-deps "${{ runner.temp }}/dist/"*.whl
      - name: Smoke test installed CLI without creating a database
        env:
          AI_MEMORY_DB: ${{ runner.temp }}/wheel-smoke.sqlite
        run: |
          "${{ runner.temp }}/wheel-smoke/bin/ai-memory" --help
          test ! -e "$AI_MEMORY_DB"
