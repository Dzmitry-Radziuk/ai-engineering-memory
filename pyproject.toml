[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ai-engineering-memory"
version = "0.1.0"
description = "Local AI engineering memory and skills management platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    "coverage==7.16.2",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pipx==1.18.4",
    "pytest",
    "ruff",
]

[project.scripts]
ai-memory = "ai_engineering_memory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_engineering_memory"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".tmp", ".pytest-run"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
python_version = "3.12"
files = ["src/ai_engineering_memory"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_configs = true
