build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-engineering-memory"
version = "0.1.0"
description = "Local AI engineering memory and skills management platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
ai-memory = "ai_engineering_memory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_engineering_memory"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [".tmp", ".pytest-run"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
testpaths = ["tests"]
